name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build only reads the repo; only the deploy job gets pages write.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build production bundle
        # GitHub Pages serves the project from /<repo>/ — keep local dev at "/".
        run: npm run build
        env:
          VITE_BASE_PATH: /Invest-ai/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` block on purpose: this repository's pre-existing
    # `github-pages` environment carries a deployment-branch policy that does
    # not include `main`, which rejects every deploy. Once Settings ->
    # Environments -> github-pages allows `main`, the recommended block can be
    # restored:
    #   environment:
    #     name: github-pages
    #     url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
